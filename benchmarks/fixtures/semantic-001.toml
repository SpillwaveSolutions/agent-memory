# QUAL-01 paraphrase set. Relevant sessions share meaning with the query
# but not tokens. First setup file is the hit; the rest are distractors
# whose query words are separated so BM25 ranks them and the lexicon does not fire.

[[test]]
id = "semantic-001"
category = "semantic"
description = "Paraphrase: token expiry policy → JWT lifetime"
setup = ["sessions/semantic-001-hit.jsonl", "sessions/semantic-001-distract.jsonl"]
query = "token expiry policy"
expected_contains = ["JWT lifetime"]
relevant = ["JWT lifetime", "fifteen minutes"]
k = 5
max_tokens = 400

