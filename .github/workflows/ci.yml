name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  release-guards:
    name: Release Guard Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run release guard tests
        run: bash scripts/release-guards-test.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test-${{ matrix.os }}"

      - name: Run tests
        run: cargo test --workspace --all-features --exclude e2e-tests

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-${{ matrix.os }}"

      - name: Build release
        run: cargo build --release --workspace

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "doc"

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "e2e"

      - name: Run E2E tests
        id: e2e_run
        continue-on-error: true
        run: cargo test -p e2e-tests --all-features -- --show-output 2>&1 | tee e2e-results.txt

      - name: Report E2E summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^test |^running |ok|FAILED|test result:" e2e-results.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check E2E test result
        if: always()
        run: |
          if [[ "${{ steps.e2e_run.outcome }}" != "success" ]]; then
            echo "E2E tests failed"
            exit 1
          fi
          echo "E2E tests passed!"

  benchmark-smoke:
    name: Benchmark Suite Smoke Test
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-smoke"

      - name: Test memory-bench
        run: cargo test -p memory-bench

      - name: Smoke locomo adapter (1 conversation, mock judge)
        run: |
          cargo run -p memory-bench -- smoke --output /tmp/locomo-smoke.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/locomo-smoke.json"))
          assert d["conversations"] == 1, d
          assert d["total_questions"] >= 1, d
          assert d["metric"] == "context_hit_rate", d
          assert "locomo_llm_judge" != d["metric"]
          print("smoke ok", d["metric"], "questions", d["total_questions"])
          PY

  bench-cli-smoke:
    name: Benchmark CLI Isolation Smoke
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-cli-smoke"

      - name: Build daemon, CLI, and bench
        run: cargo build -p memory-daemon -p memory-cli -p memory-bench

      - name: Live-backend locomo smoke (spawn-per-conversation)
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo run -p memory-bench -- locomo \
            --dataset benchmarks/fixtures/locomo-smoke.json \
            --backend cli \
            --scorer mock \
            --isolation daemon-per-conversation \
            --output /tmp/locomo-cli-smoke.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/locomo-cli-smoke.json"))
          assert d["conversations"] == 1, d
          assert d["isolation"] == "per-conversation daemon", d
          assert d["metric"] == "context_hit_rate", d
          conv = d["per_conversation"][0]
          assert "drain_wait_ms" in conv, conv
          assert conv["drain_wait_ms"] >= 0
          print("cli smoke ok", d["isolation"], "drain_wait_ms", conv["drain_wait_ms"])
          PY

      - name: Isolation bleed test
        env:
          MEMORY_BENCH_LIVE: "1"
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo test -p memory-bench cli_isolated_daemons_do_not_bleed -- --nocapture

  # Summary job that depends on all other jobs
  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, build, doc, e2e, benchmark-smoke, bench-cli-smoke, release-guards]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.doc.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.benchmark-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.bench-cli-smoke.result }}" != "success" ]] || \
             [[ "${{ needs.release-guards.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
