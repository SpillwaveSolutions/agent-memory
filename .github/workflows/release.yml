name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 3.1.0, no leading v)'
        required: true
        type: string
      dry_run:
        description: 'Run guards (and, if they pass, builds) but do not publish a GitHub Release or push a tag'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Release guards
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          raw="${raw#v}"
          echo "version=${raw}" >> "$GITHUB_OUTPUT"
          echo "tag=v${raw}" >> "$GITHUB_OUTPUT"

      - name: Guard tagged commit is on main and version matches Cargo.toml
        run: |
          bash scripts/release-guards.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --sha "${GITHUB_SHA}" \
            --main-ref origin/main \
            --cargo Cargo.toml

      - name: Guard CHANGELOG.md has a matching section
        run: |
          bash scripts/changelog-section.sh "${{ steps.meta.outputs.version }}" CHANGELOG.md \
            > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

  build:
    name: Build (${{ matrix.name }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15
            name: macos-x86_64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            name: macos-aarch64
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc llvm -y

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\lib" >> $GITHUB_ENV
          # Force dynamic CRT (/MD) for all C/C++ deps to prevent LNK2038 mismatch
          # (esaxx-rs defaults to /MT which conflicts with cxx's /MD)
          echo "CFLAGS=/MD" >> $GITHUB_ENV
          echo "CXXFLAGS=/MD" >> $GITHUB_ENV

      - name: Disable usearch simsimd for cross-compile targets
        if: matrix.cross || runner.os == 'Windows'
        shell: bash
        run: |
          # SimSIMD fails on: MSVC (missing MAP_FAILED, AVX-512 FP16), aarch64 cross
          # (missing arm_sve.h, bfloat16). Disable it and regenerate lockfile.
          sed -i.bak 's/^usearch = .*/usearch = { version = ">=2, <2.24", default-features = false, features = ["fp16lib"] }/' Cargo.toml
          cargo generate-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.name }}"

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
          PROTOC: /usr/local/bin/protoc
        run: cross build --release --target ${{ matrix.target }}

      - name: Create archive directory
        shell: bash
        run: |
          VERSION=${{ needs.guard.outputs.version }}
          ARCHIVE_DIR="agent-memory-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${ARCHIVE_DIR}"

          # Copy binaries. All four are required: the README quickstart uses
          # `memory` for search and `memory-installer` for hook setup, so an
          # archive missing either is a broken release, not a partial one.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXT=".exe"
          else
            EXT=""
          fi
          for bin in memory-daemon memory-ingest memory memory-installer; do
            src="target/${{ matrix.target }}/release/${bin}${EXT}"
            if [[ ! -f "$src" ]]; then
              echo "::error::release archive would be missing ${bin}${EXT} for ${{ matrix.name }}"
              exit 1
            fi
            cp "$src" "dist/${ARCHIVE_DIR}/"
          done

          # Copy documentation
          cp LICENSE "dist/${ARCHIVE_DIR}/" || true
          cp README.md "dist/${ARCHIVE_DIR}/" || true

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ needs.guard.outputs.version }}
          ARCHIVE_DIR="agent-memory-${VERSION}-${{ matrix.name }}"
          cd dist
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
          rm -rf "${ARCHIVE_DIR}"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.guard.outputs.version }}"
          $ARCHIVE_DIR = "agent-memory-${VERSION}-${{ matrix.name }}"
          cd dist
          Compress-Archive -Path $ARCHIVE_DIR -DestinationPath "${ARCHIVE_DIR}.zip"
          Remove-Item -Recurse -Force $ARCHIVE_DIR

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    needs: [guard, build]
    # success() is required: a custom `if` replaces the implicit "needed jobs
    # succeeded" check. The previous `if: always() && !cancelled()` is how a
    # partial set of archives could ship. dry_run skips publish after a green
    # guard+build, which is the live way to verify the guards without a tag.
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Require all five platform archives
        run: |
          ls -laR artifacts/
          missing=0
          for name in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            if ! ls artifacts/agent-memory-${{ needs.guard.outputs.version }}-${name}.* >/dev/null 2>&1; then
              echo "::error::missing archive for ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Refusing to publish a partial release."
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          bash scripts/changelog-section.sh "${{ needs.guard.outputs.version }}" CHANGELOG.md \
            > release-notes.md
          test -s release-notes.md

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a ${{ needs.guard.outputs.tag }} -m "Release ${{ needs.guard.outputs.tag }}" "${GITHUB_SHA}"
          git push origin ${{ needs.guard.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Release ${{ needs.guard.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.guard.outputs.version, '-') }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
